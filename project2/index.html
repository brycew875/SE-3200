<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Pokémon Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎲 Random Pokémon</h1>
        <p>Generate a random Pokémon!</p>

        <button id="generateButton">
            Generate Pokémon
        </button>
    </header>

    <main>

        <section id="pokemonContainer">
            <h2>Your Pokémon</h2>

            <div id="pokemonCard">
                <p>Click the button to generate a Pokémon!</p>
            </div>
        </section>

        <section>
            <h2>Previous Pokémon</h2>

            <div id="history"></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
