<!DOCTYPE html>
<html>
<head>
    <title>Navajo Community Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Navajo Community Board</h1>

        <p class="intro">
            Share a message with the community.
        </p>

        <form id="messageForm">

            <textarea
                id="message"
                placeholder="Write your message here..."
                required>
            </textarea>

            <button type="submit">Post Message</button>

        </form>

        <h2>Community Messages</h2>

        <div id="messages"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
